services:
  postgres:
    image: postgres:17-alpine
    container_name: pamiec-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pamiec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pamiec"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
