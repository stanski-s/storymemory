spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# ---- Security ---------------------------------------------------------------
# 32-char dummy secret (256 bits) — safe for tests only, never used in prod
jwt.secret=test-secret-key-for-unit-tests-only-32chars
app.secure-cookie=false

# ---- Cache ------------------------------------------------------------------
# Disable Redis entirely in tests — no external infrastructure required
spring.cache.type=none

# ---- Redis (Lettuce / Bucket4j) ---------------------------------------------
# Point to localhost so Lettuce client bean can be constructed even if unused
spring.data.redis.url=redis://localhost:6379
# Disable Redis health check — Redis is not running in the test environment
management.health.redis.enabled=false

# ---- External AI / Storage stubs -------------------------------------------
# Groq
groq.api-key=test-key
groq.base-url=http://localhost:9999
groq.model=test-model
# Cloudflare image model
cloudflare.account-id=test-account
cloudflare.api-token=test-token
cloudflare.image-model=@cf/test-model
cloudflare.num-steps=1
cloudflare.guidance=1.0
cloudflare.width=64
cloudflare.height=64
# S3 / MinIO
s3.endpoint=http://localhost:9000
s3.public-url-prefix=http://localhost:9000/test
s3.bucket=test-bucket
s3.access-key=test
s3.secret-key=test
s3.region=us-east-1
# TTS sidecar
tts.sidecar.url=http://localhost:9998/api/tts
tts.edge.default-voice=en-US-AvaMultilingualNeural




