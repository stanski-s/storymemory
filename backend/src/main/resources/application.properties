spring.application.name=pamiec-backend
server.port=8080

# Security
jwt.secret=${JWT_SECRET}
app.secure-cookie=${APP_SECURE_COOKIE:false}

# Java 25 Virtual Threads (Loom)
spring.threads.virtual.enabled=true

# Database configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pamiec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Groq Cloud AI Configuration
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Cloudflare Workers AI Image Generation Configuration
cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.image-model=${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
cloudflare.num-steps=${CLOUDFLARE_NUM_STEPS:4}
cloudflare.guidance=${CLOUDFLARE_GUIDANCE:1.0}
cloudflare.width=${CLOUDFLARE_WIDTH:768}
cloudflare.height=${CLOUDFLARE_HEIGHT:768}

# S3 / MinIO Storage Configuration
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.public-url-prefix=${S3_PUBLIC_URL_PREFIX:http://localhost:9000/pamiec-media}
s3.bucket=${S3_BUCKET:pamiec-media}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.region=${S3_REGION:us-east-1}

# Text-To-Speech (Edge-TTS Azure Neural Engine)
tts.edge.default-voice=${TTS_DEFAULT_VOICE:en-US-AvaMultilingualNeural}
tts.sidecar.url=${TTS_SIDECAR_URL:http://localhost:8090/api/tts}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

spring.cache.type=redis
