spring.application.name=pamiec-backend
server.port=8080

# Java 25 Virtual Threads (Loom)
spring.threads.virtual.enabled=true

# Database configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pamiec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Groq Cloud AI Configuration
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Hugging Face Image Generation Configuration
huggingface.api-key=${HUGGINGFACE_API_KEY:}
huggingface.base-url=${HUGGINGFACE_BASE_URL:https://router.huggingface.co/hf-inference}
huggingface.model=${HUGGINGFACE_MODEL:black-forest-labs/FLUX.1-schnell}

# S3 / MinIO Storage Configuration
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.public-url-prefix=${S3_PUBLIC_URL_PREFIX:http://localhost:9000/pamiec-media}
s3.bucket=${S3_BUCKET:pamiec-media}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.region=${S3_REGION:us-east-1}

